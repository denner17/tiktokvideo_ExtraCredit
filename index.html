<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Video For Intro to Sociology Class</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: #1f1100;
        height: 600px;
      }
      .video-container {
        display: flex;
        justify-content: center; /* Centers horizontally */
        align-items: center; /* Centers vertically (if container has a height) */
        width: 100%;
        height: 90%;
        margin: 0; /* Optional spacing above and below */
        background-color: antiquewhite;
        

      }

      video {
        max-width: 20%; /* Ensures the video scales down on mobile screens */
        height: auto;
        border-radius: 8px; /* Optional: rounds the corners */
        
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video controls>
        <source src="GirlsVsBoys_Before_exam.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </body>
</html>
